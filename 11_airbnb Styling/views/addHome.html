<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Home to Airbnb</title>

  <link rel="stylesheet" href="/css/output.css">
</head>

<body class="bg-gray-100 min-h-screen">

  <header class="bg-red-500 text-white py-6 shadow-lg">
    <h1 class="text-center text-3xl md:text-4xl font-bold">
      Register Your Stay
    </h1>
  </header>

  <main class="flex justify-center items-center min-h-[70vh] px-4">

    <form
      action="/host/add-home"
      method="POST"
      class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl"
    >

      <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
        Add Your Home
      </h2>

      <label
        for="houseName"
        class="block text-gray-700 font-semibold mb-2"
      >
        House Name
      </label>

      <input
        id="houseName"
        type="text"
        name="houseName"
        placeholder="Enter the name of your house"
        class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-6 outline-none focus:ring-2 focus:ring-red-500"
      >

      <input
        type="submit"
        value="Add Home"
        class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg cursor-pointer transition"
      >

    </form>

  </main>

</body>
</html>
