<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register Your Home</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <header class="header">
    <h1>Register Your Home</h1>
  </header>

  <main class="container">

    <div class="card">

      <h2>Add Your Property</h2>

      <p class="subtitle">
        Enter your home details below
      </p>

      <form action="/host/add-home" method="POST">

        <div class="form-group">

          <label for="houseName">
            House Name
          </label>

          <input
            type="text"
            id="houseName"
            name="houseName"
            placeholder="Enter your house name"
            required
          >

        </div>

        <button type="submit">
          Register Home
        </button>

      </form>

      <a href="/" class="back-link">
        ← Back to Home
      </a>

    </div>

  </main>

</body>

</html>
