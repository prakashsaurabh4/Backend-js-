<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Airbnb Home</title>

  <link rel="stylesheet" href="/css/output.css">
</head>

<body class="bg-gray-100 min-h-screen">

  <header class="bg-red-500 text-white py-6 shadow-lg">
    <h1 class="text-center text-4xl md:text-5xl font-bold">
      Welcome to Airbnb
    </h1>
  </header>

  <main class="flex justify-center items-center min-h-[70vh] px-4">

    <div class="bg-white p-10 rounded-2xl shadow-xl text-center max-w-lg w-full">

      <h2 class="text-2xl font-semibold text-gray-800 mb-3">
        Find Your Perfect Stay
      </h2>

      <p class="text-gray-500 mb-8">
        Discover comfortable homes and amazing places to stay.
      </p>

      <a
        href="/host/add-home"
        class="inline-block bg-red-500 hover:bg-red-600 text-white font-semibold px-8 py-3 rounded-lg transition duration-300 shadow-md"
      >
        Register Your Home
      </a>
      
    </div>

  </main>

</body>
</html>
